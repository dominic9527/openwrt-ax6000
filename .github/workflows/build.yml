
name: Build Official OpenWrt 25.12 - Redmi AX6000

on:
  workflow_dispatch:

  push:
    paths:
      - "config/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. Checkout build configuration
      - name: Checkout build repository
        uses: actions/checkout@v4

      # 2. Install build dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache

      # 3. Clone official OpenWrt source
      - name: Clone OpenWrt 25.12
        run: |
          git clone \
            --branch openwrt-25.12 \
            --single-branch \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" \
            >> "$GITHUB_ENV"

      # 4. Update feeds
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. Apply configuration
      - name: Apply AX6000 configuration
        run: |
          cp config/ax6000.config openwrt/.config

      # 6. Generate final configuration
      - name: Generate and verify configuration
        working-directory: openwrt
        run: |
          make defconfig

          echo "===== Target ====="
          grep -E '^CONFIG_TARGET_' .config

          echo "===== Required packages ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-ssl|kmod-wireguard|wireguard-tools|luci-proto-wireguard|ip-full|tcpdump|ethtool)=' \
            .config

          echo "===== Forbidden packages ====="
          if grep -E \
            '^CONFIG_PACKAGE_(pbr|luci-app-pbr|tailscale|openvpn|docker)=' \
            .config; then
            echo "Unexpected package selection!"
            exit 1
          fi

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y' \
            .config

      # 7. Download sources
      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j4

      # 8. Compile firmware
      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      # 9. Collect firmware and build information
      - name: Collect build artifacts
        working-directory: openwrt
        run: |
          mkdir -p ../artifacts

          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*ax6000*' \
              -o -name '*.manifest' \
              -o -name 'sha256sums' \
            \) \
            -exec cp {} ../artifacts/ \;

          cp .config ../artifacts/defconfig
          cp ../config/ax6000.config ../artifacts/ax6000.config

          {
            echo "OpenWrt branch: openwrt-25.12"
            echo "OpenWrt commit: $OPENWRT_COMMIT"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Target: mediatek/filogic"
            echo "Device: xiaomi_redmi-router-ax6000-ubootmod"
          } > ../artifacts/build-info.txt

          cd ../artifacts
          sha256sum *.itb *.bin > custom-sha256sums.txt 2>/dev/null || true

          echo "===== Generated files ====="
          ls -lh

      # 10. Upload firmware
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-OpenWrt-25.12-Ubootmod
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
