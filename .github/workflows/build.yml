
name: Build Official OpenWrt - Redmi AX6000

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache

      - name: Clone official OpenWrt source
        run: |
          git clone --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply AX6000 configuration
        run: |
          cp config/ax6000.config openwrt/.config

      - name: Generate final configuration
        working-directory: openwrt
        run: |
          make defconfig
          echo "===== Target configuration ====="
          grep -E 'CONFIG_TARGET_|CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|pbr|luci-app-pbr)' .config || true

      - name: Download source packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Show firmware files
        working-directory: openwrt
        run: |
          echo "===== Redmi AX6000 U-Boot mod firmware ====="
          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -name '*ax6000*' \
            -printf '%f %s bytes\n'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-OpenWrt-25.12-Ubootmod
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
